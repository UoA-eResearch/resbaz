  themes: [computing, datascience]
  registration_link: https://www.eventbrite.co.nz/e/investigating-organic-and-inorganic-chemistry-mechanisms-computationally-using-orca-resbaz-tickets-1987285643857
- id: !!int '039'
  title: Responsible AI in Research
  description: "This 1 hour online workshop explores how researchers can use AI tools\
    \ responsibly to improve the research process. Attendees will be introduced to\
    \ how AI tools work, their capabilities and limitations, and the risks of producing\
    \ incorrect or biased outputs. We\u2019ll explore some examples of how AI can\
    \ be applied to the research process, and the types of considerations that are\
    \ important. We'll finish by signposting relevant University policies and where\
    \ researchers can go for more information.\u202F "
  subtype: workshop
  speakers: [052, !!int '019']
  complexity: Beginner
  length: 1 hours
  capacity: '500'
  themes: [ai]
  registration_link: https://www.eventbrite.co.nz/e/responsible-ai-in-research-resbaz-tickets-1987285644860
- id: 040
  title: Upgrading Your R Scripts With Software Development Principles
  description: Maturing from a beginner R programmer to an intermediate-level R developer
    can be a difficult transition to make. What sorts of concepts should you spend
    time learning about, and what sorts of practices will help you to level-up your
    programming game? This 1-hour talk is aimed at researchers who are comfortable
    with basic R syntax but find themselves overwhelmed by what to do next to improve
    their scripts. We'll introduce RStudio Projects, managing code history with version
    control, breaking down scripts into functions, using dependency management tools,
    and publishing your code repositories to promote your work and give back. Adding
    these skills and practices to your toolbox will save you time, help you to collaborate
    more effectively on analyses, and ensure your findings remain reproducible years
    after publication.
  subtype: workshop
  speakers: [037, !!int '059']
  complexity: Intermediate
  length: 1 hours
  capacity: '500'
  themes: [computing, datascience]
  registration_link: https://www.eventbrite.co.nz/e/upgrading-your-r-scripts-with-software-development-principles-resbaz-tickets-1987285645863
- id: 041
  title: 'Precision Prompting: Mastering Generative AI for the Research Lifecycle'
  description: "Generative AI tools are now ubiquitous, but getting them to produce\
    \ high-quality, reliable research outputs remains a challenge. If you\u2019ve\
    \ ever been frustrated by \"hallucinations\" or generic responses, this session\
    \ is for you. We move beyond simple \"chatting\" to explore Prompt Engineering\u2014\
    the science of \"programming with words.\" We will dive into advanced techniques\
    \ like Chain-of-Thought reasoning and Few-Shot prompting to help you automate\
    \ literature summaries, debug complex code, and refine manuscript abstracts with\
    \ scientific precision."
  subtype: workshop
  speakers: [!!int '018']
  complexity: Beginner
  length: 1 hours
  capacity: '500'
  themes: [ai]
  registration_link: https://www.eventbrite.co.nz/e/precision-prompting-mastering-generative-ai-for-the-research-lifecycle-resbaz-tickets-1987285646866
- id: 042
  title: Using LLMs to programmatically extract and curate research data
  description: "Spinning raw data into analysis-ready gold often takes far more time\
    \ than anticipated. These steps don\u2019t often show up in the methods but are\
    \ critical for robust research results. Whether you're working with messy survey\
    \ responses, archival documents, or image collections, transforming unstructured\
    \ material into clean, structured variables is painstaking work that manual methods\
    \ handle poorly and traditional programming approaches struggle to scale. Large\
    \ language models change this. Used programmatically, they can extract structured\
    \ features from text, interpret images, and produce consistent, usable datasets\
    \ with more flexibility than rule-based approaches.\nIn this hands-on two-hour\
    \ workshop, you'll work with real New Zealand text and image data to extract meaningful\
    \ features using free, cloud-based tools. You'll leave with reusable code you\
    \ can adapt to your own research data, whatever your discipline. The goal is to\
    \ demystify programmatic LLM use and give you a practical foundation you can build\
    \ on immediately. Prerequisites: Basic Python programming experience will greatly\
    \ assist in participation of this workshop. Set up: As we'll will be using free\
    \ Google tools, you will be required to use a Google account to participate."
  subtype: workshop
  speakers: [022]
  complexity: Beginner
  length: 2 hours
  capacity: '80'
  themes: [ai]
  registration_link: https://www.eventbrite.co.nz/e/using-llms-to-programmatically-extract-and-curate-research-data-resbaz-tickets-1987285649875
- id: 043
  title: Introduction to JupyterLite
  description: "Do you use Jupyter but wish there was an easier way to share notebooks\
    \ with interactive outputs\u2014for research or teaching\u2014without setting\
    \ up a server or asking users to install anything? JupyterLite is a WebAssembly-based\
    \ version of Jupyter that runs entirely in the browser. This 1-hour workshop will\
    \ show you how to get it up and running on GitHub Pages, walk through a few examples,\
    \ and finish with Q&A."
  subtype: workshop
  speakers: [!!int '058']
  complexity: Beginner
  length: 1 hours
  capacity: '500'
  themes: [computing]
  registration_link: https://www.eventbrite.co.nz/e/introduction-to-jupyterlite-resbaz-tickets-1987285650878
- id: 044
  title: "Life Reset \u2013 Navigating the Professional Job Market"
  description: "Many early-career researchers find themselves questioning their readiness\
    \ for professional roles, especially when exploring opportunities beyond a single,\
    \ clearly defined pathway. Feelings of being behind, underqualified, or unsure\
    \ where to start are common. This workshop introduces a practical, step-by-step\
    \ approach to job searching that shifts the focus from vacancy scrolling to employer\
    \ research and strategic exploration. Career Consultants based in the Unviersity\
    \ of Auckland will show you how to use LinkedIn to assess role requirements, clarify\
    \ what \u201Cqualified\u201D really means, and prepare for the realities of a\
    \ professional job search with greater confidence and direction.\n"
  subtype: workshop
  speakers: [036]
  complexity: Beginner
  length: 1 hours
  capacity: '500'
  themes: [publish]
  registration_link: https://www.eventbrite.co.nz/e/life-reset-navigating-the-professional-job-market-resbaz-tickets-1987285651881
- id: 045
  title: 'The Five Safes Framework in Action: A Tour of a Secure Research Environment'
  description: "Balancing privacy, legal, and ethics requirements with the need to\
    \ access and analyse sensitive data across a project team can be challenging.\
    \ This 1\u2011hour session is for researchers working with sensitive data who\
    \ want a clear approach to data privacy and security. We will introduce the Five\
    \ Safes framework (Safe Projects, People, Settings, Data, and Outputs) and demonstrate\
    \ how these principles are practically applied within a Secure Research Environment.\
    \ By the end of the session, you\u2019ll have a clearer picture of how you can\
    \ use secure infrastructure and how recognised approaches like the Five Safes\
    \ can help meet data providers, funder and overseas partner requirements."
  subtype: workshop
  speakers: [023, !!int '059', 051]
  complexity: Beginner
  length: 1 hours
  capacity: '500'
  themes: [security, computing]
  registration_link: https://www.eventbrite.com/e/the-five-safes-framework-in-action-a-tour-of-a-secure-research-environment-resbaz-tickets-1987456409622
- id: 046
  title: A practical guide to study preregistration
  description: "Many research literatures, across disciplines, are full of findings\
    \ that cannot be replicated. A major contributor to this \u201Creplication crisis\u201D\
    \ is the use of questionable research practices that inflate statistical significance,\
    \ meaning that many published findings are not \u201Creal\u201D. Preregistration\
    \ is one solution to this problem. A preregistration is a time-stamped document\
    \ outlining a study\u2019s hypotheses, sample size, methodology, and analytical\
    \ plan before data collection begins. It therefore reduces researcher flexibility\
    \ and increases the credibility of research findings. It is increasingly required\
    \ or recommended by journals and funders, and is a valuable practice for all researchers.\
    \ In this practical session I\u2019ll introduce the options for where to post\
    \ your preregistration and walk through some of the trickier decisions that must\
    \ be made, including sample size determination, stopping rules, data exclusions,\
    \ violations of assumptions, and exploratory analyses. "
  subtype: workshop
  speakers: [062]
  complexity: Beginner
  length: 1 hours
  capacity: '500'
  themes: [publish]
  registration_link: https://www.eventbrite.co.nz/e/a-practical-guide-to-study-preregistration-resbaz-tickets-1987656706716
