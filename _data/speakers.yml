- {id: 001, name: Simon, surname: Anastasiadis, company: Social Investment Agency,
  title: Principal Data Scientist, bio: 'A data scientist and computational problem
    solver, Simon has worked with integrated data for over seven years. His experience
    includes both conducting research with integrated data at the Social Investment
    Agency and contributing to the development of integrated data processes at Stats
    NZ. Simon is the author of a range of IDI training materials including introductory
    projects, training videos, and automation tools.', thumbnailUrl: simon-anastasiadis.jpg,
  rockstar: false}
- {id: 003, name: Laura, surname: Armstrong, company: University of Auckland, title: Senior
    eResearch Engagement Specialist, bio: "Laura Armstrong is the eResearch Engagement\
    \ Lead for Waipapa Taumata Rau | University of Auckland. She collaborates to engage\
    \ with the research community to raise awareness and use of modern technologies\
    \ and tools to advance research. Areas of focus include enabling researchers to\
    \ manage research data following best practices, including FAIR, CARE and M\u0101\
    ori Data Sovereignty data principles, and providing digital research skills and\
    \ community building.", thumbnailUrl: laura_armstrong.jpg, rockstar: false}
- {id: 005, name: Ana, surname: "Avil\xE9s", company: University of Auckland, title: 'Research
    Services Adviser, Student and Scholarly Services', bio: "Ana Avil\xE9s is a Research\
    \ Services Adviser in Student and Scholarly Services with expertise in research\
    \ skills development. Ana supports early career researchers and doctoral students\
    \ with their research communication and dissemination needs.", thumbnailUrl: ana-aviles.jpg,
  rockstar: false}
- {id: 006, name: Brittany, surname: Bennenbroek, company: University of Auckland,
  title: Research Impact Adviser, bio: 'Brittany is the Research Impact Adviser at
    Waipapa Taumata Rau | University of Auckland, supporting researchers in planning
    for and evidencing the impact of their work. With a background in science communication,
    she is passionate about bridging disciplines, fostering meaningful connections,
    and translating complex ideas into accessible insights that drive real-world change.
    Brittany plays a key role in strengthening research impact culture, co-developing
    tools and resources, and developing institutional frameworks to support impactful,
    engaged research for the public good. ', thumbnailUrl: brittany-bennenbroek.png,
  rockstar: false}
- {id: 007, name: Tamsin, surname: Braisher, company: '', title: Wikimedian Editor,
  bio: "Tamsin is a Wikimedia editor in Dunedin. She writes a lot of women\u2019s\
    \ biographies on Wikipedia, and manages the New Zealand Thesis Project, which\
    \ connects information about New Zealand dissertations to their authors, advisors\
    \ and subjects on Wikidata.", thumbnailUrl: tamsin-braisher.jpg, rockstar: false}
- {id: !!int '009', name: Murray, surname: Cadzow, company: University of Otago, title: Scientific
    Programmer, bio: 'Murray is on the Scientific Programming team for Research Teaching
    and IT Support at the University of Otago. With a PhD in Biochemistry, he works
    alongside researchers with their computational workflows and organises and instructs
    Software and Data Carpentry workshops.', thumbnailUrl: murray_cadzow.jpg, rockstar: false}
- {id: 010, name: Dawn, surname: Carlisle, company: University of Auckland, title: 'Research
    Services Adviser, Student and Scholarly Services', bio: 'Dawn Carlisle is a Research
    Services Adviser in Student and Scholarly Services with expertise in supporting
    systematic-style reviews. She provides guidance on developing robust search strategies,
    navigating the publishing process, and understanding open access. Dawn also undertakes
    contracted literature searches for Health New Zealand and has a particular interest
    in supporting high-quality, evidence-based research. ', thumbnailUrl: dawn-carlisle.png,
  rockstar: false}
- {id: 011, name: Amanda, surname: Charlton, company: University of Auckland, title: Hon.
    Clinical Senior Lecturer, bio: 'Amanda is an enthusiastic biomedical educator
    at the University of Auckland and an Anatomical Pathologist at Auckland Hospital.
    Amanda is known for her simple, visual approaches to science communication across
    disciplines.', thumbnailUrl: amanda_charlton.jpg, rockstar: false}
- {id: 012, name: Maria, surname: Dams, company: University of Auckland, title: 'Research
    Services Adviser, Student and Scholarly Services', bio: 'Maria is a Research Services
    Adviser in Student and Scholarly Services. She provides research support in scholarly
    publishing, open access and responsible AI use in literature reviews and publishing.',
  thumbnailUrl: maria-dams.jpg, rockstar: false}
- {id: 013, name: Mike, surname: Dickison, company: '', title: Freelance Wikipedia
    Consultant, bio: 'Mike is a freelance Wikipedia consultant in Christchurch. A
    former museum curator and moa-bone specialist, he is currently Aotearoa Wikipedian
    at Large, improving the coverage of Banks Peninsula in Wikipedia, Commons, and
    Wikidata.', thumbnailUrl: mike-dickison.jpg, rockstar: false}
- {id: 014, name: Vicky, surname: Fan, company: REANNZ, title: Researcher Support
    Specialist, bio: 'Prior to joining NeSI, Vicky worked as a bioinformatician at
    the Bioinformatics Institute at the University of Auckland, and the NETwork! Project,
    which studied neuroendocrine cancer. When not at work, she can be found at the
    fencing salle attempting to hit people with a pointy metal stick.', thumbnailUrl: vicky-fan.png,
  rockstar: false}
- {id: 016, name: Chelsea, surname: Finnie, company: REANNZ, title: Senior Network
    DevOps Engineer, bio: 'Chelsea is a Senior Network DevOps Engineer at REANNZ who
    specialises in infrastructure automation, spanning networks, systems, and the
    platforms that support them. An expert generalist, they enjoy working across disciplines
    and technologies, focusing on maintainability, clarity, and improving how teams
    operate complex systems. Chelsea is also an active contributor to the Python community
    in Aotearoa and Australia.', thumbnailUrl: chelsea-finnie.jpg, rockstar: false}
- {id: 017, name: Victor, surname: Gambarini, company: University of Auckland, title: eResearch
    Platforms & Services Engineer, bio: 'Victor works in the Centre for eResearch
    as an eResearch Platforms & Services Engineer. He has recently completed his PhD
    in Biological Sciences at the University of Auckland. Victor has experience with
    Microbiology, Molecular Biology, and Bioinformatics, focusing on Metagenomics
    and Metatranscriptomics. At the Centre of eResearch, Victor is developing solutions
    to automate research projects'' management and consult with researchers on the
    management of research data and computational resources.', thumbnailUrl: victor_gambarini.jpeg,
  rockstar: false}
- {id: !!int '018', name: Nidhi, surname: Gowdra, company: University of Auckland,
  title: eResearch Solutions Specialist, bio: "Dr. Nidhi Gowdra is an eResearch Solutions\
    \ Specialist at the University of Auckland\u2019s Centre for eResearch (CeR).\
    \ He holds a PhD in Deep Learning with a focus on neural network optimization\
    \ and has published extensively in premier journals, including Pattern Recognition.\
    \ A recognized leader in the field, Nidhi served as the Chair of the Machine,\
    \ Signal, and Image Processing session at the IEEE Industrial Electronics Society\
    \ Conference (IECON-2020). Beyond his research, he has supervised numerous undergraduate\
    \ and postgraduate students and currently specializes in helping researchers navigate\
    \ the complexities of AI. As New Zealand's only NVIDIA-certified instructor, Nidhi\
    \ is dedicated to making advanced Deep Learning accessible to the broader research\
    \ community.", thumbnailUrl: nidhi_gowdra.jpg, rockstar: false}
- {id: !!int '019', name: Dahlia, surname: Han, company: University of Auckland, title: 'Research
    Services Adviser, Student and Scholarly Services', bio: 'Dahlia is a Research
    Services Adviser in Student and Scholarly Services, with a strong background in
    supporting the research activities of postgraduate students and staff. Her work
    focuses on the responsible use of AI in research and literature reviews, as well
    as helping researchers maintain and optimise their online research profiles. She
    delivers practical training and guidance to build research skills using a range
    of research tools and platforms.', thumbnailUrl: dahlia-han.jpg, rockstar: false}
- {id: 022, name: Kyle, surname: Hemming, company: University of Auckland, title: Senior
    Engagement Specialist, bio: 'Dr Kyle Hemming is a Senior eResearch Engagement
    Specialist at the Centre for eResearch (CeR) at Waipapa Taumata Rau | University
    of Auckland. Kyle proactively engages with researchers across the university community
    to meet emerging needs in areas such as AI, Python, R, and high-performance computing.
    With a strong technical background and a decade of experience in quantitative
    research, coupled with eight years of supporting researchers, Kyle is enthusiastic
    about enhancing research outcomes. His other areas of interest include supporting
    reproducible research, strategic planning, and stakeholder engagement.', thumbnailUrl: kyle-hemming.jpg,
  rockstar: false}
- {id: 023, name: Sarah, surname: Hopkins, company: University of Auckland, title: Senior
    Engagement Specialist, bio: Sarah Hopkins is a Senior Engagement Specialist at
    the Centre for eResearch for Waipapa Taumata Rau | University of Auckland. Sarah
    has a clinical research background in exercise physiology and youth mental health.
    She is enthusiastic about supporting researchers to navigate the evolving requirements
    for research data management and to increase digital skills and capabilities to
    enhance their research., thumbnailUrl: sarah-hopkins.jpg, rockstar: false}
- {id: 025, name: Lyn, surname: Lavery, company: Academic Consulting, title: Director,
  bio: 'Lyn is the director and founder of Academic Consulting where she utilises
    her extensive experience in both quantitative and qualitative methodologies to
    assist a diverse range of researchers, including senior academics in leading tertiary
    institutions, PhD students, and research teams within central government.', thumbnailUrl: lyn-lavery.png,
  rockstar: false}
- {id: 026, name: Jean, surname: Love, company: University of Auckland, title: Bioinformatician,
  bio: "Jean is a Bioinformatician at Waipapa Taumata Rau|University of Auckland\u2019\
    s Precision Medicine Initiative. With a background in bioinformatics, cybersecurity\
    \ software development, and management of sensitive data, Jean provides analysis\
    \ and QC for clinical and research genomics data and has developed tools and training\
    \ for handling sensitive research data at the university.", thumbnailUrl: jean-love.png,
  rockstar: false}
- {id: 027, name: Jana, surname: Makar, company: REANNZ, title: Communications Manager,
  bio: "Based in Auckland, Jana Makar is a Communications Manager at REANNZ, where\
    \ she works to highlight and support the critical role of national-scale eResearch\
    \ infrastructure in enabling data-intensive research. Prior to joining REANNZ,\
    \ she worked with multiple organisations in Canada\u2019s cyberinfrastructure\
    \ sector, from provincial research & education networks to national high performance\
    \ computing platforms. She sits on the WHPC Australasia Chapter Organising Committee.",
  thumbnailUrl: jana-makar.jpg, rockstar: false}
- {id: !!int '029', name: Julia, surname: Mouatt, company: University of Auckland,
  title: Research Development Manager, bio: 'Julia has a background in academia with
    a PhD in molecular ecology from the University of Copenhagen and a postdoc focusing
    on population genetics conducted with the U.S. Geological Survey at Oregon State
    University. After academia she worked as a product manager at the kiwi start-up
    Publons, which was acquired by Clarivate in 2017, where she was the head of the
    Web of Science Academy. While at Publons and Clarivate she helped develop online
    research integrity training courses and practical courses on how to peer review
    for journals, and set up a global peer review mentoring community built into the
    Web of Science Academy. In March 2023 she took on the role of researcher development
    manager at the University of Auckland to support academics in their professional
    development at all stages of their career.', thumbnailUrl: julia_mouatt.jpg, rockstar: false}
- {id: 030, name: Emily, surname: O'Riordan, company: Victoria University of Wellignton,
  title: Lecturer, bio: "Emily is a lecturer on the Artificial Intelligence programme\
    \ at Te Herenga Waka Victoria University of Wellington. Her research focuses on\
    \ machine learning methods for weather applications, particularly in capturing\
    \ localised weather phenomena behind extreme weather events. Both AI and weather\
    \ forecasting are computationally intensive fields, and as such HPC is vital to\
    \ her research. Emily first encountered HPC during her postdoc, after having done\
    \ her best to avoid it during her PhD due to fear of it being too complicated!\
    \ Since then, she\u2019s journeyed from HPC novice to a daily HPC user. ", thumbnailUrl: emily-oriordan.jpg,
  rockstar: false}
- {id: 031, name: Olivia, surname: Pearson, company: University of Otago, title: 'Data
    Scientist / Data Manager ', bio: 'Olivia has an MSc in Applied Bioinformatics
    with Genetic Epidemiology from Cardiff University. She works at the University
    of Otago, Christchurch, where she develops REDCap resources and provides practical
    support to research teams with database design, build, and testing. She is also
    the Data Manager for the Christchurch Health and Development Study and a certified
    Carpentries instructor. Day-to-day she''s focused on supporting researchers to
    strengthen data management practices and build computational skills to support
    robust and reproducible research.', thumbnailUrl: olivia-pearson.jpg, rockstar: false}
- {id: 032, name: Matt, surname: Plummer, company: Victoria University of Wellington,
  title: Senior Research Partner, bio: 'Matt''s background spans the arts and technology.
    He works with researchers from different disciplines to facilitate collaborative
    projects, especially those which utilise technology in innovative and transformative
    ways. He''s assisted with the development of a range of open source projects,
    augmented reality applications and research tools.', thumbnailUrl: Matt.Plummer.jpg,
  rockstar: false}
- {id: 033, name: Katrina, surname: Poppe, company: University of Auckland, title: 'Associate
    Professor, Faculty of Medical and Health Sciences', bio: 'Katrina Poppe is a biostatistician
    and clinical cardiac physiologist with extensive experience in cardiovascular
    disease from the perspectives of data science, clinical practice, and clinical,
    epidemiological and methodological research. Health data represents people and
    must be respected - from how it is collected, to how it is managed and stored,
    and importantly, how it is understood, analysed and interpreted.', thumbnailUrl: katrina-poppe.png,
  rockstar: false}
- {id: 036, name: Shannon, surname: Ring, company: University of Auckland, title: Career
    Development & Employability Consultant, bio: "Shannon Ring's impressive professional\
    \ journey includes her notable tenure of 7 years and counting at the University\
    \ of Auckland, where she has honed her skills and laid the foundation for her\
    \ successful career. As an alumna of the university, Shannon holds a Conjoint\
    \ BSc (Biology, Geography) and a BA (Languages), as well as a Postgraduate Diploma\
    \ in Translation/Interpreting, reflecting her dedication to acquiring a well-rounded\
    \ education. Drawing on her extensive experience in the industry, Shannon has\
    \ skilfully engaged in Career Conversations with individuals and groups, helping\
    \ them navigate the complexities of career development. Her expertise developed\
    \ from 8+ years working in recruitment agencies, working in-house in aspects of\
    \ human resources, and recruitment for companies, as well as her background in\
    \ career counselling and coaching, uniquely positions her to address a wide range\
    \ of career challenges faced by students and graduates. Across this time Shannon\
    \ has trained in using LinkedIn, both as a Recruiter \u2013 recruiting in Industry,\
    \ as well as developing her own use to network and create exposure for her own\
    \ mindset and career purpose coaching company, Clara & Calma.  She has secured\
    \ two roles and three contracts from her work on Linkedin \u2013 so is a strong\
    \ advocate for the use of online networking for professionals and more importantly\
    \ tertiary students wanting to develop their career paths. She is extremely excited\
    \ to be able to share her expertise so that those interested, can benefit from\
    \ her depth of knowledge in the area.", thumbnailUrl: shannon-ring.jpg, rockstar: false}
- {id: 037, name: Tom, surname: Saunders, company: University of Auckland, title: Engagement
    Specialist, bio: 'Tom is a co-organiser of ResBaz Aotearoa. He works in the Centre
    for eResearch at the University of Auckland where he coordinates researcher development
    events by planning, organising, and in some cases teaching digital research skills
    workshops, as a certified Carpentries instructor. He also consults with researchers
    on managing research data, administers the University of Auckland''s institutional
    Figshare repository, and publishes the Centre for eResearch''s pages on the ResearchHub.',
  thumbnailUrl: tom_saunders.jpg, rockstar: false}
- {id: !!int '039', name: Chris, surname: Seal, company: University of Auckland, title: Senior
    eResearch Solutions Specialist, bio: 'Chris is a Senior Solutions Specialist at
    the University of Auckland''s Centre for eResearch, where he leads the development
    of the University''s Instrument Data Service (IDS), which is built using Python.
    He has an interest in furthering the use of persistent identifiers (PIDs) as a
    means of connecting different systems together. Because of this interest, he is
    a member of the I4IOz, an Australasian community of practice developing best-practice
    guidance for using PIDs for instruments and is on the international advisory board
    for the newly developed research activity identifier (RAiD).', thumbnailUrl: chris_seal.jpg,
  rockstar: false}
- {id: 040, name: Vanessa, surname: Selak, company: University of Auckland, title: 'Associate
    Professor, Faculty of Medical and Health Sciences', bio: 'Vanessa Selak is an
    epidemiologist and Public Health Medicine Specialist with 20 years'' health sector
    experience in clinical, planning, funding, and quality roles. The use of routinely
    collected health data to improve health outcomes and equity has underpinned Vanessa''s
    academic and health sector roles.', thumbnailUrl: vanessa-selak.png, rockstar: false}
- {id: 041, name: Anthony, surname: Shaw, company: REANNZ, title: Research Support
    Specialist, bio: Research Support Specialist at REANNZ., thumbnailUrl: anthony_shaw.jpg,
  rockstar: false}
- {id: 045, name: Ben, surname: Turley, company: University of Auckland, title: Research
    Risk and Compliance Manager, bio: "Ben Turley is the Research Risk & Compliance\
    \ Manager at the University of Auckland. His role involves implementing the New\
    \ Zealand Government's Trusted Research \u2013 Protective Security Requirements\
    \ (TR-PSR) and managing the university's export control regime. Before joining\
    \ the University of Auckland, Ben worked as a civilian advisor with the New Zealand\
    \ Defence Force for 10 years. He has a background in International Relations policy\
    \ and studied Politics and History at the University of Auckland.", thumbnailUrl: ben-turley.jpg,
  rockstar: false}
- {id: 047, name: Callum, surname: Walley, company: REANNZ, title: Research Support
    Specialist, bio: 'Research Support Analyst at REANNZ, Software Carpentry Instructor.',
  thumbnailUrl: callum_walley.jpeg, rockstar: false}
- {id: !!int '049', name: Geoffrey, surname: Weal, company: REANNZ, title: Research
    Support Specialist, bio: 'Geoffrey Weal is a Research Support Specialist at REANNZ.
    Geoffrey completed his PhD in 2021 at Otago University where he specialised in
    computational chemistry. Geoffrey is an expert in global optimisation algorithms,
    molecular dynamics, catalytic and CO2 reduction chemistry, solar cell research,
    and machine learning in chemistry, having conducted postdoc research at Victoria
    University of Wellington and Kyoto University. Geoffrey is a keen programmer,
    having learnt to code in Python and C/C++, and is always interested in learning
    new coding languages for research applications. Geoffrey has experience using
    various chemistry programs, including Gaussian, ORCA, VASP, CP2K, GROMACS, and
    LAMMPS. Geoffrey is also passionate about teaching, having taught chemistry in
    schools around Southland, Otago, Auckland, Malaysia, Taiwan, and Japan. ', thumbnailUrl: geoffrey-weal.png,
  rockstar: false}
- {id: 051, name: Yvette, surname: Wharton, company: University of Auckland, title: eResearch
    Solutions Lead, bio: "Yvette Wharton works at the Centre for eResearch, Waipapa\
    \ Taumata Rau, University of Auckland. Most recently she has\u202Fbeen working\
    \ on the Secure Research Environment and machine-actionable Data Management Planning\
    \ initiatives. http://orcid.org/0000-0002-6689-8840", thumbnailUrl: yvette_wharton.jpg,
  rockstar: false}
- {id: 052, name: Erin, surname: Wood, company: University of Auckland, title: 'Research
    Services Adviser, Student and Scholarly Services', bio: 'Erin is a Research Services
    Adviser in Student and Scholarly Services. They support researchers with expertise
    in scholarly communications and AI tools for research, contributing to researcher
    capability building in ethical and responsible AI use in research and literature
    reviews.', thumbnailUrl: erin_wood.jpeg, rockstar: false}
- {id: 053, name: Lisa, surname: Woods, company: Victoria University of Wellington,
  title: Statistical Consultant, bio: 'Dr. Lisa Woods works as a Statistical Consultant
    at Victoria University of Wellington, providing statistical advice to postgraduate
    students and academic staff.', thumbnailUrl: lisa_woods.jpg, rockstar: false}
- {id: 055, name: Mazyar, surname: Zarepour, company: University of Auckland, title: Data
    Scientist, bio: 'Mazyar Zarepour is a Doctoral Candidate in Engineering Science,
    his research focuses on building data-driven optimisation models to improve healthcare
    systems. Mazyar is working as a Data Scientist at the Health Data Platform, a
    service offered by University of Auckland for staff and students. He oversees
    the data management of the Platform and provides data linkage and cohorting services.
    His vision is to combine data science and operations research to empower efficient
    health service delivery.', thumbnailUrl: mazyar-zarepour.png, rockstar: false}
- {id: 056, name: Noel, surname: Zeng, company: University of Auckland, title: eResearch
    Solutions Specialist, bio: 'Noel Zeng is an eResearch Solutions Specialist at
    the Centre for eResearch, Waipapa Taumata Rau University of Auckland. He received
    a BSc in Computer Science in 2012. While his main role is in software development,
    he is passionate about sharing skills and tips for using tools like Python, JavaScript
    and Git to accelerate your research. He is a certified [Carpentries](https://carpentries.org/)
    instructor, and hosts [HackyHour](https://uoa-eresearch.github.io/HackyHour/)
    at University of Auckland, a shared space where students and researchers can get
    help for and help others with questions around coding and data.', thumbnailUrl: noel_zeng.jpg,
  rockstar: false}
- {id: 057, name: Rayna, surname: Dewar, company: University of Auckland, title: 'Research
    Services Adviser, Student and Scholarly Services', bio: Rayna Dewar is a Research
    Services Adviser in Student and Scholarly Services. Her work focuses on providing
    guidance for those conducting systematic-style reviews and supporting research
    communication and dissemination needs for early career researchers and doctoral
    students., thumbnailUrl: rayna-dewar.jpg, rockstar: false}
- {id: !!int '058', name: Andre, surname: Geldenhuis, company: REANNZ, title: Research
    DevOps Engineer, bio: "Before joining REANNZ, I spent a year at the Center for\
    \ eResearch at the University of Auckland, where I focused on Trusted Research\
    \ Environments. Prior to that, I looked after the High-Performance Computing cluster\
    \ at Victoria University. I hold a Bachelor\u2019s degree in Philosophy and a\
    \ Master\u2019s degree in Physics from the University of Canterbury, which included\
    \ a few memorable weeks in Antarctica. Outside of work, I enjoy rock climbing\
    \ and making LED art, and I occasionally delve into model rocketry, a hobby that\
    \ combines my interest in physics and electronics.", thumbnailUrl: andre-geldenhuis.png,
  rockstar: false}
- {id: !!int '059', name: Toby, surname: Johnson, company: University of Auckland,
  title: Engagement Specialist, bio: 'Toby works as an eResearch Engagement Specialist
    at the Centre for eResearch, Waipapa Taumata Rau University of Auckland. He received
    his PhD in Psychology from the University of Exeter where he investigated computational
    models of learning. At the Centre for eResearch he provides digital research and
    AI skills training and assists researchers in accessing compute resources, including
    the Secure Research Environments.', thumbnailUrl: toby-johnson.jpg, rockstar: false}
- {id: 060, name: Daniel, surname: Walker, company: Science Media Centre, title: Media
    Advisor, bio: 'Daniel Walker is a media advisor at the Science Media Centre, where
    he helps journalists and researchers to speak each others'' language. He brings
    years of experience in broadcast journalism, on-air newsreading, and covering
    breaking news from his previous work at RNZ, Newstalk ZB, and 95bFM. Daniel enjoys
    translating complex science into something that anyone can understand and feel
    inspired by.', thumbnailUrl: daniel-walker.jpg, rockstar: false}
- {id: 061, name: Neil, surname: Birrell, company: University of Auckland, title: Research
    Fellow, bio: 'Neil Birrell is a Research Fellow at the University of Auckland
    with a fascination with insects and how people think about them. He is currently
    working on the ecology and systematics of some of our endemic giant weevils, and
    the emerging role of insects as food and feed. Neil is particularly interested
    in why eating insects feels normal in some cultures and confronting in others,
    and what that says about food, history, and perception.', thumbnailUrl: neil-birrell.jpg,
  rockstar: false}
- {id: 062, name: Gina, surname: Grimshaw, company: Victoria University of Wellington,
  title: 'Professor of Psychological Sciences ', bio: "Gina Grimshaw is a Professor\
    \ of Psychological Sciences at te Herenga Waka \u2013 Victoria University of Wellington,\
    \ where she teaches cognitive science and research methods. She is a strong advocate\
    \ of open science practices, and is an Associate Editor for Royal Society Open\
    \ Science. She sits on the Board of the Association for Interdisciplinary Meta-Research\
    \ and Open Science (AIMOS) and this year will co-host the AIMOS conference at\
    \ te Herenga Waka in Wellington. ", thumbnailUrl: gina-grimshaw.jpg, rockstar: false}
- {id: 063, name: Kevin, surname: Tsang, company: University College London, title: Lecturer
    of Health Data Science, bio: 'Dr Kevin Tsang is a Lecturer of Health Data Science
    and Programme Co-Director of the Health Data Science MSc at the Institute of Health
    Informatics, University College London (UCL), UK. He is responsible for delivering
    a spectrum of Artificial Intelligence and data analysis modules. His research
    focuses on machine learning applications, prediction modelling, and digital technologies
    for health and education. He led the AAMOS-00 study to curate a multi-modal open-access
    dataset for developing machine learning models to predict asthma attacks through
    remote monitoring and takes an advisory role on the DIGIPREDICT study in New Zealand.',
  thumbnailUrl: kevin-tsang.jpeg, rockstar: false}
- {id: 064, name: Jieyun, surname: Wu, company: University of Auckland, title: Engagement
    Specialist, bio: 'Jieyun is an eResearch Engagement Specialist at the Centre for
    eResearch, University of Auckland, where she supports researchers in adopting
    digital tools and computational practices. During her nearly five years at Auckland
    Genomics, Jieyun provided genomics sequencing and bioinformatics support to dozens
    of research groups across New Zealand universities and PROs, where she discovered
    her passion for data science and helping researchers build computational confidence.
    Prior to this, she worked as a Scientist at the Ministry for Primary Industries,
    developing eDNA-based biosecurity surveillance tools. Jieyun holds a PhD in environmental
    microbiology from the University of Auckland.', thumbnailUrl: jieyun-wu.png, rockstar: false}
- {id: 065, name: Irelie, surname: Ebardo, company: Victoria University of Wellington,
  title: 'Doctoral Student, School of Chemical & Physical Sciences', bio: 'Irelie
    is a Chemistry PhD student in the School of Chemical and Physical Sciences at
    Victoria University of Wellington. She is working on chemically modifying ionic
    liquid ions to create novel materials that serve as green and recyclable alternatives
    to traditional solvents. Ionic liquids can be chemically designed to be non-volatile,
    nonflammable, easily recycled, and non-toxic, offering a solution to the high
    environmental costs incurred by many solvents, electrolytes, and engineering fluids.
    Irelie will unravel the H-bonding complexities within ionic liquids through the
    use of quantum chemical electronic structure calculations. The aim of her project
    is to unravel the electronic structure of highly charged H-bonds, create new models
    linking the chemical structure to physico-chemical properties and to use the insights
    obtained to chemically design novel ILs.', thumbnailUrl: irelie-ebardo.jpg, rockstar: false}
- {id: 066, name: "Chlo\xE9", surname: van der Burg, company: Genomics Aotearoa, title: 'Bioinformatics
    Training Coordinator ', bio: "Chlo\xE9 is a Bioinformatics Training Coordinator\
    \ with Genomics Aotearoa, where she supports researchers throughout NZ to grow\
    \ their computational and bioinformatic skills through workshop-style training.\
    \ She is passionate about driving genomic and bioinformatic capability in Aotearoa\
    \ and has strong expertise in both, as well as many years of experience in teaching\
    \ and supervision of early career researchers. She previously worked as a Postdoctoral\
    \ researcher exploring the genetic and behavioural mechanisms driving protogynous\
    \ sex change in the New Zealand Spotty wrasse at the University of Otago. Her\
    \ research background broadly encompasses exploring evolutionary and functional\
    \ genomics, with a focus on genomic drivers of fundamental and unusual physiological\
